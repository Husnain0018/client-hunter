services:
  - type: web
    name: client-hunter-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_SECRET
        generateValue: true
      - key: CLIENT_HUNTER_ACCESS_CODE
        value: hunter2026!secret
      - key: FRONTEND_ORIGIN
        value: https://frontend-two-lilac-77.vercel.app
